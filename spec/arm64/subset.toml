# Canonical A64 subset for KJIT development.
#
# Form names are exact ARM XML identifiers in "<instruction-section>.<encoding-name>"
# format. Do not use mnemonic wildcards here.

version = 1
source = "Arm ISA XML A-profile 2026-03"
policy = "exact-form-only"


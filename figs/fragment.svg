<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1242px" height="906px" viewBox="0 0 1242 906"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="0" y="0" width="900" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="2" y="17.5">A fragment and one run (drawn in execution order; layout order is prologue, epilogue, body, cold)</text></g></g></g><g data-cell-id="P"><g><rect x="0" y="44" width="430" height="150" rx="4.5" ry="4.5" fill="#fafafa" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="12" y="67">Prologue  [0, 0xa8)</text></g></g></g><g data-cell-id="c3"><g><rect x="12" y="74" width="406" height="112" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"><text x="14" y="108.5">build the 208-byte runtime frame on the kernel stack</text><text x="14" y="121.5">save the kernel callee-saved state (x18..x30)</text><text x="14" y="134.5">store x2 (entry address), the dispatch table</text><text x="14" y="147.5">pointer (extra[2]) and the budget counter = 4096</text><text x="14" y="160.5">load the user registers from pt_regs; br x12 to the entry</text></g></g></g><g data-cell-id="B"><g><rect x="0" y="234" width="430" height="330" rx="9.9" ry="9.9" fill="#fffaf3" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 250, 243), rgb(25, 21, 15)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="12" y="257">Body: original blocks, ascending start address</text></g></g></g><g data-cell-id="B1"><g><rect x="15" y="269" width="400" height="55" rx="4.4" ry="4.4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="288">user instructions, lowered by reg-virt</text><text x="215" y="301">LDTR/STTR or PAN-window accesses,</text><text x="215" y="314">fills and spills of stack-backed registers</text></g></g></g><g data-cell-id="B2"><g><rect x="15" y="334" width="400" height="60" rx="4.8" ry="4.8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="355.5">budget check: ldr, sub, str the counter, cbz to</text><text x="215" y="368.5">the Budget stub (4 words), before every</text><text x="215" y="381.5">back-edge and every dispatch site</text></g></g></g><g data-cell-id="B3"><g><rect x="15" y="404" width="400" height="70" rx="5.6" ry="5.6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="430.5">dispatch template (9 words), for BL/BLR/BR/RET:</text><text x="215" y="443.5">slot = table[pc[13:2]]; if slot.pc == target</text><text x="215" y="456.5">then br x12 to slot.host; else fall through</text></g></g></g><g data-cell-id="B4"><g><rect x="15" y="484" width="400" height="60" rx="4.8" ry="4.8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="505.5">exit group (miss path, also Svc and Unsupported):</text><text x="215" y="518.5">x9 = status, x10 = target or word, x11 = resume pc;</text><text x="215" y="531.5">b epilogue</text></g></g></g><g data-cell-id="C"><g><rect x="0" y="584" width="430" height="170" rx="5.1" ry="5.1" fill="#fffaf3" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 250, 243), rgb(25, 21, 15)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="12" y="607">Cold region: out of line, nothing falls into it</text></g></g></g><g data-cell-id="C1"><g><rect x="15" y="619" width="400" height="55" rx="4.4" ry="4.4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="638">Mem stub, one per memory instruction (the fault</text><text x="215" y="651">fixup lands here): status Mem, x10 = insn word,</text><text x="215" y="664">x11 = original pc; b epilogue</text></g></g></g><g data-cell-id="C2"><g><rect x="15" y="684" width="400" height="55" rx="4.4" ry="4.4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="215" y="703">Budget stub, one per budget check: status Budget,</text><text x="215" y="716">x10 = branch word, x11 = its pc;</text><text x="215" y="729">b epilogue</text></g></g></g><g data-cell-id="E"><g><rect x="0" y="784" width="430" height="120" rx="3.6" ry="3.6" fill="#fafafa" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(250, 250, 250), rgb(22, 22, 22)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="12" y="807">Epilogue  [0xa8, body)</text></g></g></g><g data-cell-id="c4"><g><rect x="12" y="814" width="406" height="84" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"><text x="14" y="841">reload the kernel callee-saved state from frame slots</text><text x="14" y="854">the body cannot write; write the full user state back</text><text x="14" y="867">to pt_regs; stp x10, x11 to extra[0..1]</text><text x="14" y="880">x0 = RetStatus; ret to the trampoline</text></g></g></g><g data-cell-id="R1"><g><rect x="600" y="54" width="560" height="130" rx="10.4" ry="10.4" fill="#ffffff" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="104">Runtime (kjit_after_syscall, kjit_call_fragment)</text><text x="880" y="117">calls the fragment at its base:</text><text x="880" y="130">x0 = pt_regs, x1 = extra params (x10, x11 out; table in),</text><text x="880" y="143">x2 = base + entry offset (first entry, or a resume label)</text></g></g></g><g data-cell-id="R5"><g><rect x="600" y="209" width="560" height="100" rx="8" ry="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="244">Runtime frame, 208 bytes, sp-based (shared/abi/frame.rs)</text><text x="880" y="257">[16, 80) user-state slots, 80 entry address, 176 pt_regs pointer,</text><text x="880" y="270">192 budget counter, 200 dispatch table pointer;</text><text x="880" y="283">kernel slots: only the pt_regs pointer, the budget check and the template's table load read them</text></g></g></g><g data-cell-id="R2"><g><rect x="600" y="379" width="560" height="70" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="405.5">Dispatch table slot (per mm; table_all or table_nofp)</text><text x="880" y="418.5">record { pc, host } or 0; only the runtime writes it,</text><text x="880" y="431.5">fragment code reads it only through the template</text></g></g></g><g data-cell-id="R3"><g><rect x="600" y="484" width="560" height="70" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="510.5">Another fragment (or this one): runs from that label with</text><text x="880" y="523.5">no runtime round trip; every dispatch attempt costs</text><text x="880" y="536.5">one unit of the 4096 budget</text></g></g></g><g data-cell-id="R4"><g><rect x="600" y="784" width="560" height="120" rx="9.6" ry="9.6" fill="#ffffff" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="822.5">Runtime acts on x0 (status), x10, x11:</text><text x="880" y="835.5">Svc: invoke the next syscall in the kernel, re-enter at the resume pc</text><text x="880" y="848.5">Bl/Blr/Br/Ret (a miss): publish the label, chain into a fragment</text><text x="880" y="861.5">Unsupported, Mem, Budget, or a declined run: return to EL0 at x11,</text><text x="880" y="874.5">which re-executes natively</text></g></g></g><g data-cell-id="c5"><g><path d="M 600 119 L 439.18 119" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 431.68 119 L 439.18 115.25 L 439.18 122.75 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="482" y="113" width="67" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="515" y="123.5">1  call at base</text></g></g></g><g data-cell-id="c6"><g><path d="M 215 194 L 215 224.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 215 232.32 L 211.25 224.82 L 218.75 224.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="166" y="208" width="100" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="215" y="218.5">2  br x12 to the entry</text></g></g></g><g data-cell-id="c7"><g><path d="M 415 414.5 L 507.5 414.5 L 590.82 414.05" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 598.32 414.01 L 590.84 417.8 L 590.8 410.3 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="483" y="408" width="50" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="507.5" y="418.5">reads slot</text></g></g></g><g data-cell-id="c8"><g><path d="M 415 463.5 L 507.5 463.5 L 507.5 519 L 590.82 519" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 598.32 519 L 590.82 522.75 L 590.82 515.25 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="460" y="485" width="96" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="507.5" y="495.5">3  hit: br x12 to host</text></g></g></g><g data-cell-id="c9"><g><path d="M 415 514 L 460 514 L 460 823.6 L 439.18 823.6" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 431.68 823.6 L 439.18 819.85 L 439.18 827.35 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g></g><g data-cell-id="c10"><g><path d="M 415 646.5 L 460 646.5 L 460 823.6 L 439.18 823.6" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 431.68 823.6 L 439.18 819.85 L 439.18 827.35 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g></g><g data-cell-id="c11"><g><path d="M 415 711.5 L 460 711.5 L 460 823.6 L 439.18 823.6" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 431.68 823.6 L 439.18 819.85 L 439.18 827.35 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g></g><g data-cell-id="c12"><g><path d="M 430 848.8 L 515 848.8 L 515 844 L 590.82 844" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 598.32 844 L 590.82 847.75 L 590.82 840.25 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="496" y="841" width="40" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="515" y="851.3">5  return</text></g></g></g><g data-cell-id="c13"><g><path d="M 1160 844 L 1160 849 L 1210 849 L 1210 119 L 1169.18 119" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/><path d="M 1161.68 119 L 1169.18 115.25 L 1169.18 122.75 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(68, 68, 68), rgb(179, 179, 179)); stroke: light-dark(rgb(68, 68, 68), rgb(179, 179, 179));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><rect fill="#ffffff" stroke="none" x="1181" y="480" width="59" height="14" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="1210" y="490.5">6  next entry</text></g></g></g><g data-cell-id="c14"><g><rect x="472" y="579" width="110" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="474" y="593.5">4  b epilogue</text></g></g></g><g data-cell-id="R6"><g><rect x="600" y="594" width="560" height="90" rx="7.2" ry="7.2" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(34, 34, 34), rgb(208, 208, 208));"><text x="880" y="624">Dispatch miss: an empty slot (cbz) or a different pc (cbnz)</text><text x="880" y="637">falls into the exit group that follows the template.</text><text x="880" y="650">The runtime then resolves the target, publishes its label</text><text x="880" y="663">and may chain, so the next transfer hits</text></g></g></g></g></g></g></svg>
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1092px" height="988px" viewBox="0 0 1092 988"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="230" y="10" width="840" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#222222" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(34, 34, 34);"><text x="232" y="27">Translation pipeline: A64 to A64, no architecture-neutral IR</text></g></g></g><g data-cell-id="in"><g><rect x="230" y="42" width="320" height="50" rx="4" ry="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="65">Raw userspace bytes</text><text x="390" y="79">(CodeProvider, entry PC)</text></g></g></g><g data-cell-id="p0"><g><rect x="230" y="116" width="320" height="64" rx="5.12" ry="5.12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="139">1  Decode</text><text x="390" y="153">generated A64Insn::decode,</text><text x="390" y="167">keeps the original PC</text></g></g></g><g data-cell-id="n0"><g><rect x="610" y="116" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="139.5">Subset forms only; is_decode_undefined makes</text><text x="622" y="152.5">reserved encodings undecodable.</text><text x="622" y="165.5">Generated from Arm XML (specgen).</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><path d="M 550 148 L 610 148" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p1"><g><rect x="230" y="216" width="320" height="64" rx="5.12" ry="5.12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="239">2  Admit per PC</text><text x="390" y="253">cfg::admit_at: decode, then</text><text x="390" y="267">reg_virt::admit_insn</text></g></g></g><g data-cell-id="n1"><g><rect x="610" y="216" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="239.5">The single decision per PC. A word that is not</text><text x="622" y="252.5">admitted ends its block with an Unsupported exit;</text><text x="622" y="265.5">userspace runs it natively.</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><path d="M 550 248 L 610 248" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p2"><g><rect x="230" y="316" width="320" height="64" rx="5.12" ry="5.12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="339">3  Build the CFG</text><text x="390" y="353">reachable blocks from the</text><text x="390" y="367">entry PC, via a CodeProvider</text></g></g></g><g data-cell-id="n2"><g><rect x="610" y="316" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="339.5">Blocks partition the PC space; the block order is</text><text x="622" y="352.5">ascending start address (layout_block_order).</text><text x="622" y="365.5">An unreadable entry is a hard error.</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><path d="M 550 348 L 610 348" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p3"><g><rect x="230" y="416" width="320" height="64" rx="5.12" ry="5.12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="439">4  Rephrase</text><text x="390" y="453">semantic boundary instructions,</text><text x="390" y="467">still typed A64</text></g></g></g><g data-cell-id="n3"><g><rect x="610" y="416" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="439.5">Only producer of runtime exits, cold stubs (Mem,</text><text x="622" y="452.5">Budget), back-edge budget checks and dispatch sites.</text><text x="622" y="465.5">ADR/ADRP become absolute; PRFM, BTI become NOP.</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><path d="M 550 448 L 610 448" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p4"><g><rect x="230" y="516" width="320" height="64" rx="5.12" ry="5.12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="539">5  Register virtualization</text><text x="390" y="553">RewritePlan::build</text><text x="390" y="567">(separate structured pass)</text></g></g></g><g data-cell-id="n4"><g><rect x="610" y="516" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="539.5">x12-x17 stack-backed, x29/sp stable-mapped; user</text><text x="622" y="552.5">load/store becomes LDTR/STTR or a PAN window.</text><text x="622" y="565.5">Knows nothing about branches or budgets.</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><path d="M 550 548 L 610 548" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p5"><g><rect x="230" y="616" width="320" height="64" rx="5.12" ry="5.12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="646">6  Layout</text><text x="390" y="660">one ExecutionFragment</text></g></g></g><g data-cell-id="n5"><g><rect x="610" y="616" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="639.5">prologue, epilogue, block bodies, then the cold region;</text><text x="622" y="652.5">virtual labels; branch immediates are resolved here</text><text x="622" y="665.5">and layout self-checks its invariants.</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><path d="M 550 648 L 610 648" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p6"><g><rect x="230" y="716" width="320" height="64" rx="5.12" ry="5.12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="739">7  Emit</text><text x="390" y="753">bytes via generated</text><text x="390" y="767">A64Insn::encode()</text></g></g></g><g data-cell-id="n6"><g><rect x="610" y="716" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="746">Fragment bytes plus the fault-site table and the</text><text x="622" y="759">entry table (every label can be an entry).</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><path d="M 550 748 L 610 748" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="p7"><g><rect x="230" y="816" width="320" height="64" rx="5.12" ry="5.12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" pointer-events="all" style="fill: rgb(248, 206, 204); stroke: rgb(184, 84, 80);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="839">8  Decode and verify</text><text x="390" y="853">shared/verify (V3), run on the</text><text x="390" y="867">emitted bytes again</text></g></g></g><g data-cell-id="n7"><g><rect x="610" y="816" width="460" height="64" rx="5.12" ry="5.12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(34, 34, 34);"><text x="622" y="839.5">Independent of the translator (imports only abi, arm64,</text><text x="622" y="852.5">platform). The kernel installs only what it accepts and</text><text x="622" y="865.5">takes uses_fpsimd from this verdict.</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><path d="M 550 848 L 610 848" fill="none" stroke="#444444" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/></g></g><g data-cell-id="c11"><g><path d="M 390 92 L 390 106.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 114.32 L 386.25 106.82 L 393.75 106.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="377" y="98" width="28" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="108.5">bytes</text></g></g></g><g data-cell-id="c12"><g><path d="M 390 180 L 390 206.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 214.32 L 386.25 206.82 L 393.75 206.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="356" y="192" width="70" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="202.5">A64Insn + PC</text></g></g></g><g data-cell-id="c13"><g><path d="M 390 280 L 390 306.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 314.32 L 386.25 306.82 L 393.75 306.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="354" y="292" width="73" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="302.5">admitted insns</text></g></g></g><g data-cell-id="c14"><g><path d="M 390 380 L 390 406.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 414.32 L 386.25 406.82 L 393.75 406.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="361" y="392" width="59" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="402.5">CFG blocks</text></g></g></g><g data-cell-id="c15"><g><path d="M 390 480 L 390 506.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 514.32 L 386.25 506.82 L 393.75 506.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="348" y="492" width="86" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="502.5">rephrased blocks</text></g></g></g><g data-cell-id="c16"><g><path d="M 390 580 L 390 606.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 614.32 L 386.25 606.82 L 393.75 606.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="348" y="592" width="86" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="602.5">virtualized blocks</text></g></g></g><g data-cell-id="c17"><g><path d="M 390 680 L 390 706.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 714.32 L 386.25 706.82 L 393.75 706.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="342" y="692" width="97" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="702.5">ExecutionFragment</text></g></g></g><g data-cell-id="c18"><g><path d="M 390 780 L 390 806.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 814.32 L 386.25 806.82 L 393.75 806.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="356" y="792" width="70" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="802.5">bytes + tables</text></g></g></g><g data-cell-id="out"><g><rect x="230" y="916" width="320" height="50" rx="4" ry="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(215, 155, 0);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(34, 34, 34);"><text x="390" y="939">Verified fragment</text><text x="390" y="953">installed by the kernel, run by the harness</text></g></g></g><g data-cell-id="c19"><g><path d="M 390 880 L 390 906.82" fill="none" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 68, 68);"/><path d="M 390 914.32 L 386.25 906.82 L 393.75 906.82 Z" fill="#444444" stroke="#444444" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 68, 68); stroke: rgb(68, 68, 68);"/></g><g><g fill="#222222" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(34, 34, 34);"><rect fill="#ffffff" stroke="none" x="367" y="892" width="47" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="390" y="902.5">accepted</text></g></g></g><g data-cell-id="c20"><g><rect x="10" y="130" width="200" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="end" font-size="11px" style="fill: rgb(68, 68, 68);"><text x="208" y="146">shared/trans</text><text x="208" y="159">(cfg, rephrase, reg_virt)</text></g></g></g><g data-cell-id="c21"><g><rect x="10" y="630" width="200" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="end" font-size="11px" style="fill: rgb(68, 68, 68);"><text x="208" y="652.5">shared/emit</text></g></g></g><g data-cell-id="c22"><g><rect x="10" y="830" width="200" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#444444" font-family="Helvetica" text-anchor="end" font-size="11px" style="fill: rgb(68, 68, 68);"><text x="208" y="852.5">shared/verify</text></g></g></g></g></g></g></svg>
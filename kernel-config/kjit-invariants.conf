# KJIT kernel config invariants (K1). Merged LAST by every profile in
# scripts/setup-kernel-build.sh, which fails if any value below does not reach
# the final .config. The contracts are in tmp/pipeline.md ("P1 contracts" ->
# Privilege model, "K2 contract" -> Preconditions). Checked against Linux 7.1-rc1.
#
# Contract items with no Kconfig symbol in 7.1 (so they cannot be pinned here):
# - Hardware PAN on: CONFIG_ARM64_PAN no longer exists. The ARM64_HAS_PAN cpucap
#   (arch/arm64/kernel/cpufeature.c) is always built and cpu_enable_pan() sets
#   PSTATE.PAN whenever ID_AA64MMFR1_EL1.PAN is implemented. It is a runtime
#   property: scripts/guest-run.sh requires the boot line
#   "CPU features: detected: Privileged Access Never".
# - PSTATE.UAO == 0 while a fragment runs: CONFIG_ARM64_UAO no longer exists and
#   nothing in arch/arm64 sets PSTATE.UAO (SET_PSTATE_UAO/set_pstate_uao have no
#   callers). An exception taken to EL1 clears UAO, so on the syscall path LDTR/STTR
#   at EL1 are unprivileged (EL0-permission) accesses.
# - kCFI: 7.1 renamed CFI_CLANG to CFI; CFI_CLANG is a transitional symbol that
#   never appears in .config, so CONFIG_CFI is the option that is pinned below.
#
# Checked and deliberately NOT pinned:
# - ARM64_LSUI: only used by asm/futex.h (unprivileged atomics). It does not
#   change PAN/UAO or LDTR/STTR behaviour.
# - ARM64_EPAN: extends PAN to EL0 execute-only mappings for privileged accesses.
#   Fragment user accesses are LDTR/STTR, which are unprivileged, so EPAN has no
#   effect on them. Runtime accesses never target user memory.
# - ARM64_MTE: LDTR/STTR at EL1 are tag-checked with TCF0 (asm/mte-kasan.h),
#   the same as the kernel's own copy_from_user.
# - ARM64_PTR_AUTH_KERNEL: kernel keys are live at EL1, so a PAC instruction inside
#   a fragment would sign/authenticate with the kernel key. The decoded subset has
#   no PAC instructions: only the exact NOP word is a decoded hint, so PACIASP and
#   AUTIASP take the Unsupported exit and run in userspace. If PAC hints are ever
#   decoded, revisit this.

# The fragment owns x18 as an ordinary user register; SCS keeps the kernel's
# shadow-call-stack pointer in x18 (and dynamic SCS depends on this option).
# CONFIG_SHADOW_CALL_STACK is not set

# The kernel calls fragment code through a function pointer. Fragment entries
# carry no kCFI type hash, so a kCFI-checked indirect call to them would trap.
# CONFIG_CFI is not set

# The shared prologue ends in `br x12` into the fragment body, whose targets
# have no BTI landing pads. With kernel BTI enforced that branch faults.
# CONFIG_ARM64_BTI_KERNEL is not set

# With SW TTBR0 PAN (on a CPU without hardware PAN), TTBR0_EL1 points at an
# empty table outside uaccess_ttbr0_enable() windows, so a fragment LDTR/STTR
# could not reach user page tables. Fragments rely on hardware PAN only.
# CONFIG_ARM64_SW_TTBR0_PAN is not set

# kjit.ko is an out-of-tree Rust module.
CONFIG_MODULES=y
CONFIG_RUST=y
# K2: the syscall-return hook and the fragment exception-table lookup that
# kjit.ko registers (kernel-patches/0001, 0002; every profile builds from the
# patched tree). It selects MMU_NOTIFIER and depends on the four options above.
CONFIG_ARM64_KJIT=y

# kjit-guest-debug: kjit-guest plus sanitizers. Merged after kjit-guest.conf.
#
# Generic KASAN, not SW_TAGS: CONFIG_RUST depends on !KASAN_SW_TAGS in 7.1
# (init/Kconfig), while generic KASAN is supported for Rust code
# (scripts/Makefile.kasan RUSTFLAGS_KASAN).
CONFIG_KASAN=y
CONFIG_KASAN_GENERIC=y
# VMAP_STACK (kjit-guest.conf) depends on KASAN_VMALLOC once KASAN is on.
CONFIG_KASAN_VMALLOC=y
CONFIG_PROVE_LOCKING=y
CONFIG_DEBUG_ATOMIC_SLEEP=y
CONFIG_DEBUG_LIST=y

# Build fix, not a feature: in 7.1-rc1 rust/helpers/dma-resv.c is always built,
# and with DEBUG_MUTEXES (selected by PROVE_LOCKING) dma_resv_unlock() calls
# dma_resv_reset_max_fences(), which only exists with DMA_SHARED_BUFFER
# (drivers/dma-buf/dma-resv.c). Without it vmlinux fails to link. SYNC_FILE is
# the smallest visible option that selects DMA_SHARED_BUFFER. Delete this once
# the upstream helper is guarded by CONFIG_DMA_SHARED_BUFFER.
CONFIG_SYNC_FILE=y

# kjit-guest: a Debian bookworm arm64 userland (redis-server, redis-benchmark)
# booted from an initramfs under QEMU/HVF. Merged after tiny-qemu-base.conf,
# tiny-qemu-rust.conf and tiny-qemu-debug.conf, on top of tinyconfig.
#
# tinyconfig starts from allnoconfig, so every syscall family the userland uses
# is listed explicitly. setup-kernel-build.sh fails if one of them is dropped.

# Undo tiny.config choices that would skew the E0 syscall baseline.
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
# CONFIG_SLUB_TINY is not set
# CONFIG_LD_DEAD_CODE_DATA_ELIMINATION is not set

# Full preemption: fragments run preemptible on the syscall path (they may
# fault and sleep), so the most aggressive preemption model is the one that
# exposes preemption bugs. 7.1 arm64 offers only PREEMPT and PREEMPT_LAZY.
CONFIG_PREEMPT=y
CONFIG_NO_HZ_IDLE=y
CONFIG_HIGH_RES_TIMERS=y

# Syscalls glibc, redis and jemalloc use. RSEQ is on because glibc registers
# rseq by default (the K2 known-limitation is about rseq).
CONFIG_MULTIUSER=y
CONFIG_SYSVIPC=y
CONFIG_POSIX_TIMERS=y
CONFIG_FUTEX=y
CONFIG_EPOLL=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EVENTFD=y
CONFIG_SHMEM=y
CONFIG_AIO=y
CONFIG_ADVISE_SYSCALLS=y
CONFIG_MEMBARRIER=y
CONFIG_RSEQ=y
CONFIG_FILE_LOCKING=y
CONFIG_INOTIFY_USER=y
CONFIG_PROC_SYSCTL=y
CONFIG_BUG=y

# /init is a shell script; /tmp, /run and /dev/shm are tmpfs.
CONFIG_BINFMT_SCRIPT=y
CONFIG_TMPFS=y

# Entropy for getrandom() without waiting on jitter (guest-run adds virtio-rng).
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_VIRTIO=y

# Distro-like kernel entry/exit path, so the E0 baseline measures the mode
# switch a real deployment pays. Kernel BTI stays off (kjit-invariants.conf).
CONFIG_UNMAP_KERNEL_AT_EL0=y
CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y
CONFIG_ARM64_PTR_AUTH=y
CONFIG_ARM64_PTR_AUTH_KERNEL=y
CONFIG_ARM64_BTI=y
CONFIG_ARM64_E0PD=y
CONFIG_VMAP_STACK=y
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y

# Symbolized oops/lockdep/KASAN reports.
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
